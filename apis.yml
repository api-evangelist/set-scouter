name: Set Scouter
description: >-
  Set Scouter is a location-scouting marketplace, built by former producers,
  that connects film, television, commercial, and branded-content productions
  with residential and commercial filming locations across North America.
  Producers browse film-ready spaces — kitchens, lofts, warehouses, mansions
  and more — arrange in-person scouts, and book online with payments, deposits
  and overtime handled by the platform, while property owners list their spaces
  to earn income from productions. The company operates from offices in Toronto
  and Los Angeles, serving markets including Toronto, New York, Los Angeles,
  Miami, Chicago, Vancouver, Montreal and Atlanta.
